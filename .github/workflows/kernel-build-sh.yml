name: kernel-build-sh

on:
  push:
    branches:
      - KSU
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo tree
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort | sed -n '1,200p'

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bash \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            ninja-build \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            xz-utils \
            zip \
            zstd

      - name: Make build script executable
        run: |
          chmod +x build_kernel.sh || true

      - name: Provide missing prebuilts
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y python3
          curl -L https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o bazel
          chmod +x bazel
          sudo mv bazel /usr/local/bin/bazel
          mkdir -p kernel/prebuilts/build-tools/path/linux-x86
          ln -sf /usr/bin/python3 kernel/prebuilts/build-tools/path/linux-x86/python3
          mkdir -p kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64
          ln -sf /usr/local/bin/bazel kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel
          ls -l kernel/prebuilts/build-tools/path/linux-x86/python3
          ls -l kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel

      - name: Run build_kernel.sh
        env:
          CI: "true"
        run: |
          set -euxo pipefail
          ./build_kernel.sh

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p upload
          find . \
            \( -iname "*.img" -o -iname "*.Image" -o -iname "*.Image.gz" -o -iname "*.Image.lz4" -o -iname "*.dtb" -o -iname "*.dtbo" -o -iname "*.zip" -o -iname "boot.img" -o -iname "init_boot.img" \) \
            -type f -exec cp --parents {} upload/ \; || true
          find upload -type f | sort || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-sh-artifacts
          path: upload
          if-no-files-found: warn            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            ninja-build \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            xz-utils \
            zip \
            zstd

      - name: Make build script executable
        run: |
          chmod +x build_kernel.sh || true
      
       - name: Provide missing prebuilts
         run: |
           set -euxo pipefail

           sudo apt update
           sudo apt install -y python3

           curl -L https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o bazel

           chmod +x bazel
           sudo mv bazel /usr/local/bin/bazel

           mkdir -p kernel/prebuilts/build-tools/path/linux-x86

           ln -sf /usr/bin/python3 kernel/prebuilts/build-tools/path/linux-x86/python3

           mkdir -p kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64

           ln -sf /usr/local/bin/bazel kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel

           ls -l kernel/prebuilts/build-tools/path/linux-x86/python3
           ls -l kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel

      - name: Run build_kernel.sh
        env:
          CI: "true"
        run: |
          set -euxo pipefail
          ./build_kernel.sh

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p upload
          find . \
            \( -iname "*.img" -o -iname "*.Image" -o -iname "*.Image.gz" -o -iname "*.Image.lz4" -o -iname "*.dtb" -o -iname "*.dtbo" -o -iname "*.zip" -o -iname "boot.img" -o -iname "init_boot.img" \) \
            -type f -exec cp --parents {} upload/ \; || true
          find upload -type f | sort || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-sh-artifacts
          path: upload
          if-no-files-found: warn
