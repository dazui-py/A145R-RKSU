name: kernel-build-sh

on:
  push:
    branches:
      - KSU
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bash bc bison build-essential ccache curl flex git libelf-dev libssl-dev lld llvm ninja-build pahole python3 python3-pip rsync unzip xz-utils zip zstd

      - name: Prepare prebuilts
        run: |
          set -euxo pipefail
          curl -L https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o bazel
          chmod +x bazel
          sudo mv bazel /usr/local/bin/bazel
          mkdir -p kernel/prebuilts/build-tools/path/linux-x86
          ln -sf /usr/bin/python3 kernel/prebuilts/build-tools/path/linux-x86/python3
          mkdir -p kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64
          ln -sf /usr/local/bin/bazel kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel

      - name: Run build
        env:
          CI: "true"
        run: |
          set -euxo pipefail
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p upload
          find . -type f \( -name "*.img" -o -name "*.zip" -o -name "boot.img" -o -name "init_boot.img" \) -exec cp --parents {} upload/ \; || true
          find upload -type f | sort || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-sh-artifacts
          path: upload
          if-no-files-found: warn
